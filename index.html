<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>SESI - Alimentação</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <link
    rel="icon"
    href="./src/img/food-icon.png"
    type="image/png"
  />

  <script>
    window.addEventListener("load", () => {
      setTimeout(() => {
        window.location.href = "./src/pages/login.html";
      }, 1500);
    });
  </script>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      width:100%;
      min-height:100vh;

      background:#f4f4f4;

      display:flex;
      justify-content:center;
      align-items:center;
      flex-direction:column;

      font-family:"Poppins", sans-serif;
    }

    .loader-wrapper{
      position:relative;

      width:120px;
      height:120px;

      display:flex;
      justify-content:center;
      align-items:center;
    }

    .loader-ring{
      position:absolute;

      width:110px;
      height:110px;

      border-radius:50%;

      border:5px solid #d7d7d7;
      border-top:5px solid #ff0000;
      border-right:5px solid #ff0000;

      animation:spin .8s linear infinite;
    }

    .loader-logo{
      width:62px;
      height:62px;

      display:flex;
      justify-content:center;
      align-items:center;

      z-index:2;
    }

    .loader-logo img{
      width:100%;
      object-fit:contain;
    }

    .loading-text{
      margin-top:18px;

      color:#3a3a3a;

      font-size:16px;

      font-family:"Poppins", sans-serif;
    }

    @keyframes spin{
      from{
        transform:rotate(0deg);
      }

      to{
        transform:rotate(360deg);
      }
    }
  </style>
</head>

<body>

  <div class="loader-wrapper">
    <div class="loader-ring"></div>

    <div class="loader-logo">
       <img src="./img/food-icon.png" alt="Logo" />
    </div>
  </div>

  <p class="loading-text">
    Entrando . . .
  </p>

</body>
</html>
